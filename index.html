<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="shortcut icon" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Tab — a clean, private, customizable new tab for Chrome and Firefox. Search, weather, calendar, tasks, time-on-site and more, all stored on your device."
    />
    <meta name="theme-color" content="#c4704b" />
    <title>The Tab</title>
    <script>
      (function () {
        var KEY = "the-tab-web-theme";
        function byTime() {
          var h = new Date().getHours();
          return h >= 6 && h < 18 ? "light" : "dark";
        }
        function resolved() {
          var saved = localStorage.getItem(KEY);
          if (saved === "light" || saved === "dark") return saved;
          return byTime();
        }
        document.documentElement.setAttribute("data-theme", resolved());
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
