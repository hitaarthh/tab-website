<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Tab — a clean, private, customizable new tab for Chrome and Firefox. Search, weather, calendar, tasks, time-on-site and more, all stored on your device."
    />
    <meta name="theme-color" content="#c4704b" />
    <title>The Tab — the only new tab you'll ever need</title>
    <script>
      (function () {
        var KEY = "the-tab-web-theme";
        function resolved() {
          var saved = localStorage.getItem(KEY);
          if (saved === "light" || saved === "dark") return saved;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", resolved());
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
